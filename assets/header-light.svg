<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 40" width="280" height="40" fill="none">
  <style>
    .mono { font-family: ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'PingFang SC', sans-serif; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor { animation: blink 1.1s step-end infinite; }
  </style>
  <text x="0" y="26" fill="#1f2328" font-size="22" font-weight="600" letter-spacing="-0.4" class="sans">donts</text>
  <text x="68" y="26" fill="#656d76" font-size="13.5" class="mono">@CrxusDonts</text>
  <rect class="cursor" x="168" y="13" width="8" height="16" rx="1.5" fill="#656d76" />
</svg>
